<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>수평선 비행 멀미 가드</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png" sizes="180x180">
<style>
/* 기내 야간 조명에 맞춘 어두운 단일 테마. 화면 전체가 '창밖', 위아래 띠가 계기판. */
:root{
  --night:#0b1220; --ink:#e8eef6; --muted:#8ea0b8; --line:#f2c14e; --ok:#5fd39a; --warn:#f2c14e; --bad:#ff7a6b;
  --panel:rgba(11,18,32,.78); --chip:rgba(255,255,255,.08);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","PingFang SC","Malgun Gothic","Microsoft YaHei","Noto Sans CJK KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block}

/* 상단 계기 */
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:10px;background:linear-gradient(var(--panel),transparent);pointer-events:none}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600;padding:6px 11px}
.tilt{display:flex;align-items:center;gap:14px;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.tilt b{font-family:var(--mono);font-size:52px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ok);min-width:2.6ch}
.tilt div{display:flex;flex-direction:column;gap:3px;min-width:0}
.tilt span{font-size:20px;font-weight:800}
.tilt small{font-size:14px;color:#d5deea}

.banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 132px);transform:translateX(-50%);
  width:max-content;max-width:min(92vw,420px);padding:12px 16px;border-radius:14px;background:var(--line);color:#1b1404;font-weight:700;
  text-align:center;font-size:15px;line-height:1.4;transition:opacity .4s;opacity:0;pointer-events:none}
.banner.on{opacity:1}

.breath{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);
  font-size:14px;color:var(--ink);letter-spacing:.04em;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* 하단 조작 */
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:linear-gradient(transparent,var(--panel))}
button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}
button:focus-visible,select:focus-visible{outline:2px solid var(--line);outline-offset:2px}
button.primary{background:var(--line);color:#1b1404;border-color:transparent}
button[aria-pressed="true"]{background:rgba(242,193,78,.22);border-color:var(--line)}
.seg{display:flex;width:100%;max-width:420px;padding:3px;gap:3px;border-radius:13px;background:rgba(11,18,32,.6);border:1px solid rgba(255,255,255,.12)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px}
.seg button[aria-pressed="true"]{background:var(--line);color:#1b1404}

/* 시트 */
.sheet{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,9,16,.6);z-index:7}
.sheet .card{width:100%;max-width:520px;max-height:88%;overflow:auto;background:#121b2d;border-radius:20px 20px 0 0;
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:20px}
.sheet p,.sheet li{color:#c7d2e1;line-height:1.6;font-size:15px;margin:0}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row select{max-width:60%}
select{font:inherit;color:var(--ink);background:#0b1220;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:9px 10px}
label.chk{display:flex;align-items:center;gap:10px;font-size:15px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--line);flex:none}

/* 시작 화면: 뒤에 고른 도시가 비침 */
.intro{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:flex-end;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(5,9,16,0) 40%,rgba(5,9,16,.55))}
.intro .box{width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;background:rgba(11,18,32,.84);padding:20px;border-radius:20px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.intro .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.intro h1{margin:0;font-size:28px;letter-spacing:-.01em}
.intro .head select{padding:7px 8px;font-size:14px}
.intro p{margin:0;color:#c7d2e1;line-height:1.6;font-size:14px}
.intro .hint{font-size:13px;color:var(--muted)}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
.pick label{font-size:14px;font-weight:700;color:var(--muted)}
.pick select{width:100%;font-size:16px;padding:11px 10px}
.intro .btns{display:flex;gap:10px;flex-wrap:wrap}
.intro .btns button{flex:1 1 140px;padding:14px}
.err{color:var(--bad);font-size:14px;line-height:1.5}
/* 탑승객 사진 */
.crew{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crew .lbl{font-size:14px;font-weight:700;color:var(--muted)}
.face{width:48px;height:48px;border-radius:50%;padding:0;overflow:hidden;display:grid;place-items:center;font-size:22px;font-weight:400;
  border:1.5px dashed rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.on{border:2px solid var(--line)}
.crew .mk{margin-left:auto;padding:10px 12px;font-size:13px}
.crew small{flex-basis:100%;font-size:12px;color:var(--muted)}
#cropCv{width:min(260px,70vw);height:auto;aspect-ratio:1;align-self:center;border-radius:12px;touch-action:none;background:#000;cursor:grab}
#shareImg{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:#000}
.sheet .btns{display:flex;gap:10px}
.sheet .btns button{flex:1}
.sheet .hint{font-size:13px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--line)}
@media (prefers-reduced-motion:reduce){.banner{transition:none}}
</style>
</head>
<body>
<canvas id="view" aria-label="flight view"></canvas>

<div class="hud" id="hud" hidden>
  <div class="tilt">
    <b id="tiltNum">0°</b>
    <div><span id="tiltDir"></span><small id="tiltLvl"></small></div>
  </div>
  <div class="status">
    <span class="pill" id="turb"></span>
    <span class="pill" id="cityTag"></span>
    <span class="pill" id="demoTag" data-i18n="demo_tag" hidden></span>
  </div>
</div>

<div class="banner" id="banner" role="status" aria-live="polite"></div>
<div class="breath" id="breathText" hidden></div>

<div class="bar" id="bar" hidden>
  <div class="seg" id="phaseSeg" role="group">
    <button data-p="takeoff" data-i18n="takeoff"></button><button data-p="cruise" data-i18n="cruise"></button><button data-p="landing" data-i18n="landing"></button>
  </div>
  <button id="btnCard" data-i18n="card_btn"></button>
  <button id="btnTips" data-i18n="tips_btn"></button>
  <button id="btnZero" data-i18n="zero"></button>
  <button id="btnBreath" aria-pressed="false" data-i18n="breath"></button>
  <button id="btnSet" data-i18n="settings"></button>
  <button id="btnStop" data-i18n="stop"></button>
</div>

<section class="intro" id="intro">
  <div class="box">
    <div class="head">
      <h1 data-i18n="app"></h1>
      <select id="lang" aria-label="Language">
        <option value="ko">한국어</option><option value="ja">日本語</option><option value="en">English</option><option value="zh">中文</option>
      </select>
    </div>
    <p data-i18n="intro_desc"></p>
    <div class="pick">
      <label for="dep" data-i18n="dep"></label><select id="dep"></select>
      <label for="arr" data-i18n="arr"></label><select id="arr"></select>
    </div>
    <p class="hint" data-i18n="intro_hint"></p>
    <div class="crew">
      <span class="lbl" data-i18n="crew"></span>
      <button class="face" id="face0"><img alt="" hidden><span>+</span></button>
      <button class="face" id="face1"><img alt="" hidden><span>+</span></button>
      <button class="mk" id="btnCard2" data-i18n="card_make"></button>
      <small data-i18n="crew_hint"></small>
    </div>
    <input type="file" id="facePick" accept="image/*" hidden>
    <div class="btns">
      <button class="primary" id="btnStart" data-i18n="start"></button>
      <button id="btnDemo" data-i18n="demo"></button>
    </div>
    <div class="err" id="err" hidden></div>
  </div>
</section>

<div class="sheet" id="tips" hidden>
  <div class="card">
    <h2 data-i18n="tips_title"></h2>
    <ul id="tipsList"></ul>
    <button id="tipsClose" class="primary" data-i18n="close"></button>
  </div>
</div>

<div class="sheet" id="settings" hidden>
  <div class="card">
    <h2 data-i18n="settings"></h2>
    <div class="row"><span data-i18n="set_dep"></span><select id="setDep"></select></div>
    <div class="row"><span data-i18n="set_arr"></span><select id="setArr"></select></div>
    <div class="row">
      <span data-i18n="tod"></span>
      <select id="tod">
        <option value="auto" data-i18n="tod_auto"></option>
        <option value="day" data-i18n="day"></option>
        <option value="dusk" data-i18n="dusk"></option>
        <option value="night" data-i18n="night"></option>
      </select>
    </div>
    <div class="row">
      <span data-i18n="lang"></span>
      <select id="setLang">
        <option value="ko">한국어</option><option value="ja">日本語</option><option value="en">English</option><option value="zh">中文</option>
      </select>
    </div>
    <label class="chk"><input type="checkbox" id="optBanner" checked> <span data-i18n="opt_banner"></span></label>
    <button id="setClose" class="primary" data-i18n="close"></button>
  </div>
</div>

<div class="sheet" id="cropSheet" hidden>
  <div class="card">
    <h2 data-i18n="crop_title"></h2>
    <canvas id="cropCv" width="520" height="520"></canvas>
    <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1">
    <p class="hint" data-i18n="crop_hint"></p>
    <div class="btns"><button id="cropRemove" data-i18n="crop_remove"></button><button id="cropOk" class="primary" data-i18n="crop_ok"></button></div>
  </div>
</div>

<div class="sheet" id="shareSheet" hidden>
  <div class="card">
    <h2 data-i18n="card_btn"></h2>
    <img id="shareImg" alt="">
    <p class="hint" data-i18n="share_hint"></p>
    <div class="btns"><button id="shareSave" data-i18n="save"></button><button id="shareGo" class="primary" data-i18n="share"></button></div>
    <button id="shareClose" data-i18n="close"></button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
// 앱 주소: 도메인이 바뀌면 이 줄만 고치면 여행 사진의 QR 코드와 공유 문구가 같이 바뀜
const APP_URL = 'https://cho-daehan.github.io/airsick-horizon/';
const D2R = Math.PI / 180, R2D = 180 / Math.PI;

// ---------- 설정 저장 ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem('horizon.'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('horizon.'+k, JSON.stringify(v)); }catch(e){} }
};
const sysLang = (() => { const l = (navigator.language || 'en').toLowerCase(); return l.startsWith('ko') ? 'ko' : l.startsWith('ja') ? 'ja' : l.startsWith('zh') ? 'zh' : 'en'; })();
const opt = { lang: store.get('lang', sysLang), dep: store.get('dep', store.get('city', 'ICN')), arr: store.get('arr', 'HND'),
  phase: 'takeoff', tod: store.get('tod', 'auto'), banner: store.get('banner', true), breath: store.get('breath', false) };
// 선회 중 기울기 추정에 쓰는 비행 속도 (m/s): 이착륙 땐 느리고 순항 땐 빠름
const PHASE_SPEED = {takeoff:90, cruise:230, landing:90};
opt.speed = PHASE_SPEED[opt.phase];
$('tod').value = opt.tod;
$('optBanner').checked = opt.banner;

// ---------- 언어 ----------
const I18N = {
  ko:{app:'수평선', intro_desc:'몸이 느끼는 기울기를 화면 속 비행기로 보여줘서 멀미를 줄여요.', dep:'출발', arr:'도착',
    intro_hint:'이륙할 땐 출발 도시, 착륙할 땐 도착 도시가 보여요.', start:'센서 켜고 시작', demo:'데모 보기',
    takeoff:'이륙', cruise:'순항', landing:'착륙', tips_btn:'멀미 팁', zero:'영점 맞추기', breath:'호흡 가이드', settings:'설정', stop:'정지',
    tips_title:'비행 멀미 줄이는 법', close:'닫기',
    tips:['날개 위 좌석이 가장 덜 흔들려요. 창가라면 창밖 수평선을 보세요.',
      '머리를 헤드레스트에 붙여 고정하면 귀가 받는 자극이 줄어요.',
      '책이나 폰 글자를 오래 보지 마세요. 이 앱 화면도 가볍게 보는 용도예요.',
      '머리 위 환기구를 열어 얼굴 쪽으로 바람을 두세요.',
      '탑승 전과 비행 중엔 기름진 음식과 술을 피하고 가볍게 드세요.',
      '멀미약은 보통 탑승 30분~1시간 전에 먹어요. 종류와 용량은 약사와 상담하세요.',
      '속이 안 좋으면 눈을 감고 천천히 호흡하세요. 4초 들이쉬고 6초 내쉬기.'],
    set_dep:'출발 도시', set_arr:'도착 도시', tod:'시간대', tod_auto:'자동 (폰 시계)', day:'낮', dusk:'노을', night:'밤', lang:'언어',
    opt_banner:'기울기 시작할 때 화면 알림',
    level:'수평', tilt_r:'오른쪽으로 기울어짐', tilt_l:'왼쪽으로 기울어짐',
    lvl:['안정적으로 날고 있어요','살짝 기울었어요','보통 정도로 기울었어요','크게 기울었어요. 화면 속 비행기를 보세요'],
    turb:['난기류 없음','난기류 약함','난기류 보통','난기류 강함'],
    tag_dep:'출발', tag_arr:'도착', tag_cruise:'순항 · 구름 위',
    alert_r:'오른쪽으로 기울어지는 중이에요. 화면 속 비행기를 보세요.', alert_l:'왼쪽으로 기울어지는 중이에요. 화면 속 비행기를 보세요.',
    alert_level:'수평으로 돌아오는 중이에요. 화면 속 비행기를 보세요.', zero_done:'지금 자세를 수평으로 맞췄어요.',
    err_https:'센서는 https:// 주소에서만 켜져요. 배포한 주소로 열어 주세요. 지금은 데모만 볼 수 있어요.',
    err_denied:'동작 센서 권한이 거부됐어요. 설정 > Safari > 동작 및 방향 접근을 켠 뒤 다시 시도하세요.',

    err_nosensor:'이 기기에서 자이로 센서 값을 받지 못했어요. 폰에서 열었는지 확인하세요. 데모로 화면을 볼 수 있어요.',
    breath_in:'들이쉬기', breath_out:'내쉬기', demo_tag:'데모',
    crew:'탑승객', crew_add:'탑승객 사진 추가', crew_hint:'사진은 서버에 올라가지 않고 이 폰에만 저장돼요.',
    crop_title:'얼굴 맞추기', crop_hint:'끌어서 옮기고, 막대로 크기를 조절하세요.', crop_ok:'태우기', crop_remove:'빼기',
    card_btn:'여행 사진', card_make:'여행 사진 만들기', share:'공유하기', save:'저장',
    share_hint:'공유가 안 되면 이미지를 길게 눌러 저장하세요.', card_tag2:'함께 떠나는 중', card_tag1:'떠나는 중'},
  ja:{app:'水平線', intro_desc:'体が感じる傾きを画面の飛行機で見せて、乗り物酔いを和らげます。', dep:'出発', arr:'到着',
    intro_hint:'離陸時は出発地、着陸時は到着地の街が見えます。', start:'センサーをオンにして開始', demo:'デモを見る',
    takeoff:'離陸', cruise:'巡航', landing:'着陸', tips_btn:'酔い対策', zero:'水平を合わせる', breath:'呼吸ガイド', settings:'設定', stop:'停止',
    tips_title:'飛行機酔いを和らげるコツ', close:'閉じる',
    tips:['主翼の上の席がいちばん揺れにくいです。窓側なら外の水平線を見ましょう。',
      '頭をヘッドレストにつけて固定すると、耳への刺激が減ります。',
      '本やスマホの文字を長く読むのは避けましょう。このアプリも軽く眺める程度に。',
      '頭上の送風口を開けて、顔に風を当てましょう。',
      '搭乗前と機内では、脂っこい食事やお酒を控えて軽めに食べましょう。',
      '酔い止めは通常、搭乗の30分〜1時間前に飲みます。種類と量は薬剤師に相談してください。',
      '気分が悪いときは目を閉じてゆっくり呼吸しましょう。4秒吸って6秒吐きます。'],
    set_dep:'出発地', set_arr:'到着地', tod:'時間帯', tod_auto:'自動(スマホの時計)', day:'昼', dusk:'夕焼け', night:'夜', lang:'言語',
    opt_banner:'傾き始めたら画面で知らせる',
    level:'水平', tilt_r:'右に傾いています', tilt_l:'左に傾いています',
    lvl:['安定して飛んでいます','少し傾いています','やや傾いています','大きく傾いています。画面の飛行機を見てください'],

// ---------- 벡터 ----------
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0],a[1],a[2]) || 1; return [a[0]/l,a[1]/l,a[2]/l]; };
const sub = (a,b) => [a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const scale = (a,s) => [a[0]*s,a[1]*s,a[2]*s];

// ---------- 상태 ----------
const S = {
  roll:0, pitch:0,          // 기체 기울기 추정 (deg). roll + = 오른쪽, pitch + = 기수 올림
  rollRate:0, pitchRate:0,  // deg/s (부드럽게)
  yaw:0,                    // 선회율 deg/s, + = 왼쪽
  heading:0,                // 누적 방향 변화 (점 이동용)
  vAcc:0, turb:0,           // 수직 가속 m/s², 난기류 세기(RMS)
  bob:0,
  up:[0,1,0],               // 기기 좌표계에서 '위' 방향
  accSign:1, signVotes:0,
  zeroRoll:0, zeroPitch:0
};
let running = false, demo = false, lastT = 0, gotMotion = false, gotOrient = false;

// ---------- 센서 ----------
// 기울기(deviceorientation)로 기기 좌표계의 '위' 방향을 구함: [-cosβ·sinγ, sinβ, cosβ·cosγ]
function onOrient(e){
  if (e.beta == null || e.gamma == null) return;
  gotOrient = true;
  const b = e.beta*D2R, g = e.gamma*D2R;
  const u = [-Math.cos(b)*Math.sin(g), Math.sin(b), Math.cos(b)*Math.cos(g)];
  // 천천히 따라가게 (기체가 아닌 손 흔들림 영향 감소)
  S.up = norm([S.up[0]*0.9+u[0]*0.1, S.up[1]*0.9+u[1]*0.1, S.up[2]*0.9+u[2]*0.1]);
}

function onMotion(e){
  if (!running || demo) return;
  const now = performance.now();
  const dt = Math.min(0.1, Math.max(0.001, (now - (lastT||now))/1000 || 0.016));
  lastT = now;
  const rr = e.rotationRate;
  if (!rr || rr.alpha == null) return;
  gotMotion = true;

  const up = S.up;
  // 기체 앞쪽: 폰을 세워 들면 폰 뒷면 방향, 눕혀 두면 폰 윗변 방향
  let fwd = Math.abs(up[2]) < 0.75 ? [0,0,-1] : [0,1,0];
  fwd = norm(sub(fwd, scale(up, dot(fwd, up))));
  const right = cross(fwd, up);

  const w = [rr.beta||0, rr.gamma||0, rr.alpha||0]; // x,y,z 축 회전 (deg/s)
  const rollRate  = dot(w, fwd);
  const pitchRate = dot(w, right);
  const yawRate   = dot(w, up);

  integrate(dt, rollRate, pitchRate, yawRate, verticalAccel(e, up));
}

// 위아래 가속 (난기류). iOS/안드로이드 부호 차이는 중력 방향과 비교해 자동 보정
function verticalAccel(e, up){
  const g = e.accelerationIncludingGravity;
  if (g && g.x != null && S.signVotes < 60){
    const d = dot([g.x,g.y,g.z], up);
    if (Math.abs(d) > 5){ S.accSign = d > 0 ? 1 : -1; S.signVotes++; }
  }
  const a = e.acceleration;
  if (!a || a.x == null) return 0;
  return dot([a.x,a.y,a.z], up) * S.accSign;
}

// 자이로(빠른 변화) + 선회율로 계산한 기울기(꾸준한 값)를 섞는 상보 필터
function integrate(dt, rollRate, pitchRate, yawRate, vAcc){
  const k = 1 - Math.exp(-dt/0.25);
  S.rollRate  += (rollRate  - S.rollRate)*k;
  S.pitchRate += (pitchRate - S.pitchRate)*k;
  S.yaw       += (yawRate   - S.yaw)*k;

  const V = opt.speed;
  const rollFromTurn = -Math.atan(V * S.yaw * D2R / 9.81) * R2D;
  const a = Math.exp(-dt/8);
  S.roll = a*(S.roll + rollRate*dt) + (1-a)*rollFromTurn;
  S.pitch = (S.pitch + pitchRate*dt) * Math.exp(-dt/25);
  S.roll = Math.max(-45, Math.min(45, S.roll));
  S.pitch = Math.max(-25, Math.min(25, S.pitch));

  S.heading += S.yaw*dt;
  S.vAcc += (vAcc - S.vAcc)*(1 - Math.exp(-dt/0.08));
  S.turb = Math.sqrt(S.turb*S.turb*Math.exp(-dt/2) + vAcc*vAcc*(1-Math.exp(-dt/2)));
  S.bob += (S.vAcc*16 - S.bob)*(1 - Math.exp(-dt/0.15));

  checkAlert();
}

// ---------- 데모 (센서 없이 비행 흉내) ----------
let demoT = 0;
function demoStep(dt){
  demoT += dt;
  const t = demoT % 60;
  let yaw = 0, pr = 0, v = 0;
  if (t > 6 && t < 22) yaw = -1.2 * Math.sin(Math.PI*(t-6)/16);        // 오른쪽 선회
  if (t > 30 && t < 42) yaw = 0.9 * Math.sin(Math.PI*(t-30)/12);       // 왼쪽 선회
  if (t > 44 && t < 52) pr = 1.4 * Math.sin(2*Math.PI*(t-44)/8);       // 상승 후 복귀
  if (t > 24 && t < 29) v = 2.2*Math.sin(t*9) + 1.3*Math.sin(t*23.7);  // 난기류
  const targetRoll = -Math.atan(opt.speed*yaw*D2R/9.81)*R2D;
  const rollRate = (targetRoll - S.roll) * 0.9;
  integrate(dt, rollRate, pr, yaw, v);
}

// ---------- 알림 ----------
let alertCool = 0, rateHold = 0, bannerTimer = 0;
function checkAlert(){
  const now = performance.now();
  rateHold = Math.abs(S.rollRate) > 1.5 ? rateHold + 1 : 0;
  if (rateHold > 20 && now > alertCool){
    alertCool = now + 12000;
    const roll = S.roll - S.zeroRoll;
    const leveling = Math.abs(roll) > 3 && Math.sign(roll) !== Math.sign(S.rollRate);
    if (opt.banner) showBanner(L(leveling ? 'alert_level' : S.rollRate > 0 ? 'alert_r' : 'alert_l'));
  }
}
function showBanner(text){
  const b = $('banner'); b.textContent = text; b.classList.add('on');

const PLANE = (() => {
  const body = [];
  for (let z = 17.6; z >= -16; z -= 0.4){
    let r = 1.8, y = 0;
    if (z > 12) r = 1.8*Math.sqrt(Math.max(0, 1 - Math.pow((z-12)/5.7, 2)));            // 둥근 기수
    else if (z < -7){ const k = (-7 - z)/9; r = 1.8 - 1.45*Math.pow(k, 1.2); y = 0.95*k*k; } // 위로 올라가며 가늘어지는 꼬리
    body.push([0, y, z, Math.max(0.28, r)]);
  }
  const engine = s => { const E = []; for (let z = 5.2; z >= 0.2; z -= 0.3){ const k = (5.2 - z)/5; E.push([6*s, -1.75, z, 1.0 - 0.3*k*k]); } return E; };
  const wing = s => [[1.6*s,-0.7,4.5],[9*s,0.1,-0.3],[16*s,0.9,-4.2],[16.25*s,0.95,-5.7],[9*s,0.2,-4.8],[1.6*s,-0.6,-3.4]];
  const winglet = s => [[16*s,0.9,-4.2],[16.5*s,2.8,-5.8],[16.6*s,2.85,-6.5],[16.25*s,0.95,-5.7]];
  const stab = s => [[0.6*s,0.45,-11],[6*s,1.0,-14.3],[6.1*s,1.02,-15.3],[0.6*s,0.55,-13.9]];
  const fin = [[0,1.3,-9.4],[0,6.9,-14.1],[0,7.0,-15.9],[0,1.3,-15.5]];
  return {body, engR:engine(1), engL:engine(-1), wingR:wing(1), wingL:wing(-1), wlR:winglet(1), wlL:winglet(-1), stabR:stab(1), stabL:stab(-1), fin};
})();

    } else {
      // 왼쪽은 빛 받는 면, 오른쪽은 그늘 면
      const gr = g.createLinearGradient(x + minX*u, 0, x + maxX*u, 0);
      gr.addColorStop(0, P.land[0]); gr.addColorStop(0.5, P.land[0]); gr.addColorStop(0.52, P.land[1]); gr.addColorStop(1, P.land[1]);
      g.fillStyle = gr;
    }
    path(); g.fill(EVENODD.has(k) ? 'evenodd' : 'nonzero'); g.shadowBlur = 0;
    if (!full && tod === 'night'){
      // 윤곽 조명 + 창문
      g.save(); path(); g.clip(EVENODD.has(k) ? 'evenodd' : 'nonzero');
      for (let i = 0; i < 260; i++){
        const wx = x + (minX + rnd()*(maxX-minX))*u, wy = base - rnd()*topY*u;
        g.fillStyle = `rgba(255,236,200,${0.25 + rnd()*0.5})`; g.fillRect(wx, wy, 1.1, 1);
      }
      g.restore();
      g.strokeStyle = GLOW[k] || '#dfe8ff'; g.lineWidth = 1; g.shadowColor = g.strokeStyle; g.shadowBlur = 8; g.globalAlpha = 0.85;
      path(); g.stroke(); g.globalAlpha = 1; g.shadowBlur = 0;
    } else if (!full && P.rim){
      g.save(); path(); g.clip(); g.fillStyle = P.rim; g.globalAlpha = 0.5; g.fillRect(x + minX*u, base - topY*u, (maxX-minX)*u*0.12, topY*u); g.restore(); g.globalAlpha = 1;
    } else if (!full){
      g.save(); path(); g.clip(); g.fillStyle = 'rgba(255,255,255,.07)';
      for (let y = base - topY*u; y < base; y += 3) g.fillRect(x + minX*u, y, (maxX-minX)*u, 0.8);
      g.restore();
    }
    if (night) beacons.push({b, y: Hy - shapeTop(k)*u - 1.5});
  }

  // 5) 가까운 건물
  layer(1.25, 0.5, Hy+3, P.near, P.winOn*1.1, true, 1.2);

  // 6) 강·바다: 도시가 물에 비침
  let groundTop = Hy + 4;
  if (C.water){
    const wt = Hy + 4, wh = C.water === 2 ? 36 : 15;
    const copy = document.createElement('canvas'); copy.width = cv.width; copy.height = cv.height;
    copy.getContext('2d').drawImage(cv, 0, 0);
    const wg = g.createLinearGradient(0, wt, 0, wt+wh);
    wg.addColorStop(0, P.water[0]); wg.addColorStop(1, P.water[1]);
    g.fillStyle = wg; g.fillRect(0, wt, Wp, wh);
    // 반사: 위 그림을 뒤집어 물결처럼 줄마다 살짝 흔들어 붙임
    g.save(); g.globalAlpha = night ? 0.55 : 0.28; g.setTransform(1,0,0,1,0,0);
    const rowsD = Math.ceil(wh*DPR), srcBot = (Hy+3)*DPR;
    for (let r = 0; r < rowsD; r++){
      const srcY = srcBot - r*(1.6 + r/rowsD*1.5);
      if (srcY < 0) break;
      const off = (rnd()*2 - 1) * (1 + r/rowsD*3) * DPR;
      g.globalAlpha = (night ? 0.6 : 0.3) * (1 - r/rowsD*0.7);
      g.drawImage(copy, 0, srcY, copy.width, 1, off, wt*DPR + r, copy.width, 1);
    }
    g.restore(); g.setTransform(DPR,0,0,DPR,0,0);
    // 반짝임 줄
    g.fillStyle = night ? 'rgba(255,220,160,.12)' : 'rgba(255,255,255,.18)';
    for (let i = 0; i < Wp/6; i++) g.fillRect(rnd()*Wp, wt + rnd()*wh, 2 + rnd()*8, 0.7);
    // 밤엔 물 위에 세로로 길게 늘어진 불빛 반사
    if (night){
      const xa = px(-C.span), xb = px(C.span);
      for (let i = 0; i < (xb-xa)/3; i++){
        const sx = xa + rnd()*(xb-xa), len = 4 + rnd()*rnd()*wh, a = 0.25 + rnd()*0.5;
        const col = rnd() < 0.75 ? '255,200,130' : '190,220,255';
        const sg = g.createLinearGradient(0, wt, 0, wt+len);
        sg.addColorStop(0, `rgba(${col},${a})`); sg.addColorStop(1, `rgba(${col},0)`);
        g.fillStyle = sg; g.fillRect(sx, wt, 0.8 + rnd()*1.2, len);
      }
    }
    groundTop = wt + wh;
  }

  // 7) 가까운 땅: 밤엔 거리 불빛, 낮엔 도시 블록
  const gg = g.createLinearGradient(0, groundTop, 0, Hp);
  gg.addColorStop(0, P.near[1]); gg.addColorStop(1, P.grd[0]);
  g.fillStyle = gg; g.fillRect(0, groundTop, Wp, Hp - groundTop);
  const x0 = px(-C.span*1.3), x1 = px(C.span*1.3);
  if (night){
    // 가로등 줄 (가로로 이어진 불빛)
    for (let row = 0; row < 14; row++){
      const y = groundTop + 2 + Math.pow(row/14, 1.6)*(Hp - groundTop - 6), sp = 1.4 + row*0.35;
      for (let x = x0 + rnd()*sp; x < x1; x += sp*(0.6 + rnd()*0.8)){
        if (rnd() < 0.55) continue;
        const s = 0.6 + row*0.07 + rnd()*0.5, w = rnd();
        g.fillStyle = w < 0.75 ? `rgba(255,${180 + (rnd()*60|0)},${90 + (rnd()*60|0)},${0.5 + rnd()*0.5})` : `rgba(220,235,255,${0.5 + rnd()*0.4})`;
        g.fillRect(x, y, s, s);
      }
    }
    // 큰 도로 (불빛 띠)
    for (let i = 0; i < 6; i++){
      const y = groundTop + 4 + rnd()*(Hp - groundTop - 10);
      const gl = g.createLinearGradient(0, y-1.5, 0, y+1.5);
      gl.addColorStop(0, 'rgba(255,170,80,0)'); gl.addColorStop(0.5, `rgba(255,185,100,${0.35*P.glow})`); gl.addColorStop(1, 'rgba(255,170,80,0)');
      const ra = x0 + rnd()*200, rl = (x1-x0)*(0.3 + rnd()*0.5);
      g.fillStyle = gl; g.fillRect(ra, y-1.5, rl, 3);
      roads.push({y, a:ra, l:rl, sp: 8 + rnd()*10, n: Math.floor(rl/18)});
    }
  } else {
    for (let i = 0; i < 900; i++){
      const t = rnd(), y = groundTop + 1 + t*t*(Hp - groundTop - 4), s = 1 + t*3;
      g.fillStyle = rnd() < 0.5 ? 'rgba(200,205,210,.18)' : 'rgba(40,50,45,.22)';
      g.fillRect(x0 + rnd()*(x1-x0), y, s*(1 + rnd()*2), s*0.5);
    }
  }
  // 빛 번짐: 작게 줄였다 키운 사본을 더해 불빛이 은은하게 번지게
  if (night){
    for (const [div, a] of [[6, tod === 'night' ? 0.5 : 0.25], [16, tod === 'night' ? 0.45 : 0.2]]){
      const sm = document.createElement('canvas');
      sm.width = Math.max(1, Math.ceil(cv.width/div)); sm.height = Math.max(1, Math.ceil(cv.height/div));
      const sx = sm.getContext('2d'); sx.imageSmoothingEnabled = true; sx.imageSmoothingQuality = 'high';
      sx.drawImage(cv, 0, 0, sm.width, sm.height);
      g.save(); g.setTransform(1,0,0,1,0,0); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a;
      g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
      g.drawImage(sm, 0, 0, cv.width, cv.height); g.restore();
    }
  }
  // 아래쪽은 투명하게 사라지게
  g.globalCompositeOperation = 'destination-in';
  const fade = g.createLinearGradient(0, Hp - 40, 0, Hp);
  fade.addColorStop(0, 'rgba(0,0,0,1)'); fade.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = fade; g.fillRect(0, 0, Wp, Hp);
  g.globalCompositeOperation = 'source-over';

  return {cv, Wp, Hp, Hy, beacons, roads};
}

function drawCity(t, cx, hy, f, P, tod){
  const ppd = f*D2R;
  const X = b => cx + wrap180(b + S.heading)*ppd;
  // 별과 달
  if (P.star){
    if (!drawCity.stars){ const r = mulberry(42); drawCity.stars = Array.from({length:140}, () => ({b:r()*360, e:r(), s:r()})); }
    ctx.fillStyle = '#ffffff';
    for (const s of drawCity.stars){
      const x = X(s.b); if (x < -2 || x > W+2) continue;
      const y = hy*0.92*(1 - s.e);
      ctx.globalAlpha = P.star*(0.25 + 0.75*s.s)*Math.min(1, (hy - y)/80);
      ctx.fillRect(x, y, s.s > 0.85 ? 2 : 1.2, s.s > 0.85 ? 2 : 1.2);
    }
    ctx.globalAlpha = 1;
  }
  if (tod === 'night'){
    const mx = X(-35), my = hy*0.28;
    const gl = ctx.createRadialGradient(mx, my, 0, mx, my, 60);
    gl.addColorStop(0, 'rgba(240,238,220,.35)'); gl.addColorStop(1, 'rgba(240,238,220,0)');
    ctx.fillStyle = gl; ctx.fillRect(mx-60, my-60, 120, 120);
    ctx.fillStyle = '#f1efe2'; ctx.beginPath(); ctx.arc(mx, my, 8, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(10,20,48,.9)'; ctx.beginPath(); ctx.arc(mx+4, my-2, 7, 0, 7); ctx.fill();   // 초승달
  } else {
    const sx = X(tod === 'day' ? 55 : 38), sy = tod === 'day' ? hy*0.3 : hy - 14, r = tod === 'day' ? 90 : 150;
    const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
    gr.addColorStop(0, tod === 'day' ? 'rgba(255,255,240,.9)' : 'rgba(255,200,120,.95)');
    gr.addColorStop(0.12, tod === 'day' ? 'rgba(255,255,230,.5)' : 'rgba(255,160,90,.55)');
    gr.addColorStop(1, 'rgba(255,200,150,0)');
    ctx.fillStyle = gr; ctx.fillRect(sx-r, sy-r, r*2, r*2);
  }
  const id = currentCity();
  if (!id) return;
  // 밤 도시 불빛이 하늘에 번지는 빛
  if (P.glow){
    const span = CITIES[id].span + 20, x0 = X(0);
    const gr = ctx.createLinearGradient(0, hy-110, 0, hy);
    gr.addColorStop(0, 'rgba(255,150,80,0)'); gr.addColorStop(1, `rgba(255,150,80,${0.25*P.glow})`);
    ctx.fillStyle = gr; ctx.fillRect(Math.max(0, x0 - span*ppd), hy-110, Math.min(W, x0 + span*ppd) - Math.max(0, x0 - span*ppd), 110);
  }
  const pn = getPano(id, tod, f);
  const left = X(0) - PANO_SPAN*ppd;
  if (left < W && left + pn.Wp > 0) ctx.drawImage(pn.cv, left, hy - pn.Hy, pn.Wp, pn.Hp);
  // 밤 도로 위를 달리는 차 불빛 (흰 전조등 / 빨간 미등)
  if (P.glow && !reduceMotion){
    for (const r of pn.roads){
      const y = hy - pn.Hy + r.y, step = r.l / Math.max(1, r.n);
      for (let k = 0; k < r.n; k++){
        const d1 = ((t/1000*r.sp + k*step) % r.l + r.l) % r.l;
        const d2 = ((-t/1000*r.sp*0.8 + k*step + 7) % r.l + r.l) % r.l;
        const xa = left + r.a + d1, xb = left + r.a + d2;
        if (xa > -2 && xa < W+2){ ctx.fillStyle = 'rgba(255,250,235,.9)'; ctx.fillRect(xa, y-0.9, 1.4, 1); }
        if (xb > -2 && xb < W+2){ ctx.fillStyle = 'rgba(255,70,60,.85)'; ctx.fillRect(xb, y+0.3, 1.4, 1); }
      }
    }
  }
  // 높은 건물 꼭대기 항공 장애등 (깜빡임)
  for (const bc of pn.beacons){
    if (((t/1000 + bc.b*0.13) % 1.6 + 1.6) % 1.6 > 0.8) continue;
    const x = X(bc.b), y = hy - pn.Hy + bc.y;
    if (x < -5 || x > W+5) continue;
    ctx.fillStyle = 'rgba(255,60,50,.35)'; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff4a3d'; ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 7); ctx.fill();
  }
}

const parts = [];
function spawn(p, anywhere){
  p.g = Math.random() < 0.55;                       // 땅 위 점(순항 땐 구름 바다) / 구름
  p.x = (Math.random()*2-1) * 260;
  p.y = p.g ? -60 : (Math.random()*40 - 16);
  p.z = anywhere ? 20 + Math.random()*420 : 440;
  p.s = p.g ? 0.8 : 4 + Math.random()*5;
  return p;
}
for (let i = 0; i < 110; i++) parts.push(spawn({}, true));
let chaseLast = 0;

function drawChase(t, card){
  const dt = card ? 0 : Math.min(0.1, (t - (chaseLast||t))/1000); if (!card) chaseLast = t;
  const tod = timeOfDay(), P = PAL[tod], cruise = opt.phase === 'cruise';
  const roll = (S.roll - S.zeroRoll)*D2R, pitch = (S.pitch - S.zeroPitch)*1.5*D2R;
  const cx = W/2, hy = H*0.44, f = Math.min(W*0.95, H*0.6);

  // 하늘 / 땅 (수평선은 고정). 순항 중엔 땅 대신 구름 바다
  let g = ctx.createLinearGradient(0,0,0,hy);
  g.addColorStop(0,P.sky[0]); g.addColorStop(0.6,P.sky[1]); g.addColorStop(1,P.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,hy+1);
  g = ctx.createLinearGradient(0,hy,0,H);
  if (cruise){ g.addColorStop(0, mix(P.deck[0], P.haze, 0.3)); g.addColorStop(0.25, P.deck[0]); g.addColorStop(1, P.deck[1]); }
  else { g.addColorStop(0,P.grd[0]); g.addColorStop(0.35,P.grd[1]); g.addColorStop(1,P.grd[2]); }
  ctx.fillStyle = g; ctx.fillRect(0,hy,W,H-hy);
  drawCity(t, cx, hy, f, P, tod);

  // 구름·땅 점 이동: 앞으로 날아가는 속도 + 선회하면 옆으로 흐름
  const th = S.yaw*dt*D2R, c = Math.cos(th), s = Math.sin(th), sp = 70*dt;
  for (const p of parts){
    const x = p.x*c + p.z*s, z = -p.x*s + p.z*c;
    p.x = x; p.z = z - sp;
    if (p.z < 4 || Math.abs(p.x) > p.z*1.6 + 60) spawn(p, false);
  }
  const proj = (x,y,z) => [cx + f*x/z, hy - f*y/z];
  const deckRGB = hex(P.deck[0]).join(',');
  const drawPart = p => {
    const [sx, sy] = proj(p.x, p.y - CAM.y, p.z);
    const fade = Math.min(1, (440 - p.z)/120) * Math.min(1, p.z/30);
    if (p.g){
      if (cruise){                                  // 구름 바다의 뭉게구름
        const r = f*5/p.z;
        ctx.fillStyle = `rgba(${deckRGB},${(0.55*fade).toFixed(3)})`;
        ctx.beginPath(); ctx.ellipse(sx, sy, r*1.6, r*0.6, 0, 0, 7); ctx.fill();
      } else {
        const r = f*p.s/p.z;
        ctx.fillStyle = P.gdot.replace('A', (P.ga*fade).toFixed(3)); ctx.beginPath(); ctx.arc(sx,sy,Math.max(1,r),0,7); ctx.fill();
      }
    } else {
      // 가까운 구름은 흐리게 (도시와 비행기를 가리지 않게), 이착륙 땐 구름이 적음
      const r = f*p.s/p.z;
      const cf = fade * Math.min(1, Math.max(0, (p.z - 15)/90)) * (cruise ? 1 : 0.5);
      ctx.fillStyle = P.cloud.replace('A', (P.ca*cf).toFixed(3));
      ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.arc(sx+r*0.9,sy+r*0.25,r*0.7,0,7); ctx.arc(sx-r*0.9,sy+r*0.3,r*0.6,0,7); ctx.fill();
    }
  };
  const far = parts.filter(p => p.z > -CAM.z).sort((a,b) => b.z - a.z);
  const near = parts.filter(p => p.z <= -CAM.z).sort((a,b) => b.z - a.z);
  far.forEach(drawPart);

  // 비행기: 롤 → 피치 회전 후 원근 투영. 카메라가 뒤쪽 위라서 엔진 → 날개 → 몸통 → 꼬리 순으로 그림
  const cr = Math.cos(roll), sr = Math.sin(roll), cp = Math.cos(pitch), sp2 = Math.sin(pitch);
  const bobY = S.bob*0.03 + (reduceMotion ? 0 : Math.sin(t/900)*0.15);
  const tf = v => {
    let x = v[0]*cr + v[1]*sr, y = -v[0]*sr + v[1]*cr, z = v[2];
    const y2 = y*cp + z*sp2, z2 = -y*sp2 + z*cp;
    return [x, y2 + bobY - CAM.y, z2 - CAM.z];
  };
  const shade = (c, k) => [mix(c, '#ffffff', 0.5*k), c, mix(c, '#141b28', 0.5)];
  const bodyC = shade(P.body, 1), engC = shade(P.eng, 0.7);
  // 원통: 단면 원마다 위쪽은 밝고 아래쪽은 어둡게
  const tube = (secs, cols) => {
    let last = null;
    for (const s of secs){
      const q = tf(s); if (q[2] < 1) continue;
      const [x, y] = proj(q[0], q[1], q[2]), r = f*s[3]/q[2];
      const gr = ctx.createLinearGradient(x - r*0.35, y - r, x + r*0.35, y + r);
      gr.addColorStop(0, cols[0]); gr.addColorStop(0.45, cols[1]); gr.addColorStop(1, cols[2]);
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      last = [x, y, r];
    }
    return last;
  };
  // 면: 뿌리 → 끝으로 색이 변하고, 앞전에 얇은 빛
  const surf = (pts, c0, c1, edge) => {
    const sc = pts.map(v => { const q = tf(v); return proj(q[0], q[1], q[2]); });
    const gr = ctx.createLinearGradient(sc[0][0], sc[0][1], sc[2][0], sc[2][1]);
    gr.addColorStop(0, c0); gr.addColorStop(1, c1);
    ctx.fillStyle = gr; ctx.beginPath(); sc.forEach((q,i) => i ? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1])); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(10,16,28,.18)'; ctx.lineWidth = 0.7; ctx.stroke();
    if (edge){
      ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); edge.forEach((i,k) => k ? ctx.lineTo(sc[i][0],sc[i][1]) : ctx.moveTo(sc[i][0],sc[i][1])); ctx.stroke();
    }
    return sc;
  };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // 엔진 + 뒤쪽 배기구
  for (const e of [PLANE.engR, PLANE.engL]){
    const end = tube(e, engC);
    if (end){
      ctx.fillStyle = mix(P.eng, '#05080d', 0.7); ctx.beginPath(); ctx.arc(end[0], end[1], end[2]*0.62, 0, 7); ctx.fill();
      ctx.fillStyle = mix(P.eng, '#05080d', 0.4); ctx.beginPath(); ctx.arc(end[0], end[1] - end[2]*0.08, end[2]*0.3, 0, 7); ctx.fill();
    }
  }
  // 날개 + 플랩 선 + 윙렛
  const wingHi = mix(P.wing, '#ffffff', 0.25), wingLo = mix(P.wing, '#141b28', 0.18);
  for (const [w, wl, s] of [[PLANE.wingR, PLANE.wlR, 1], [PLANE.wingL, PLANE.wlL, -1]]){
    surf(w, wingHi, wingLo, [0,1,2]);
    const a = tf([2.6*s,-0.52,-2.6]), b = tf([14.6*s,0.84,-5.2]);
    const [ax, ay] = proj(a[0],a[1],a[2]), [bx, by] = proj(b[0],b[1],b[2]);
    ctx.strokeStyle = 'rgba(10,16,28,.22)'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    surf(wl, mix(P.acc, '#ffffff', 0.15), mix(P.acc, '#141b28', 0.25));
  }
  // 몸통
  const tail = tube(PLANE.body, bodyC);
  if (tail){ ctx.fillStyle = mix(P.body, '#141b28', 0.6); ctx.beginPath(); ctx.arc(tail[0], tail[1], tail[2]*0.55, 0, 7); ctx.fill(); }
  // 수평 꼬리날개, 수직 꼬리날개
  for (const st of [PLANE.stabR, PLANE.stabL]) surf(st, wingHi, wingLo, [0,1]);
  surf(PLANE.fin, mix(P.acc, '#ffffff', 0.1), mix(P.acc, '#141b28', 0.35), [0,1]);
  // 탑승객 얼굴: 몸통 위에 올라타서 비행기와 같이 기울어짐
  const crew = faceImgs.filter(Boolean);
  if (crew.length){
    const xs = crew.length === 1 ? [0] : [-2.4, 2.4];
    crew.forEach((img, i) => {
      const q = tf([xs[i], 3.3, 2.5]), [x, y] = proj(q[0], q[1], q[2]), r = f*2.2/q[2];
      const sh = tf([xs[i], 1.75, 2.5]), [shx, shy] = proj(sh[0], sh[1], sh[2]);
      ctx.fillStyle = 'rgba(10,16,28,.35)'; ctx.beginPath(); ctx.ellipse(shx, shy, r*0.9, r*0.32, roll, 0, 7); ctx.fill();
      ctx.save(); ctx.translate(x, y); ctx.rotate(roll);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);

  const navLight = (v, col, r) => {
    const q = tf(v), [x, y] = proj(q[0], q[1], q[2]);

}

// 기울기 눈금 + 호흡 가이드 (두 시점 공통). pointer: 눈금 바늘이 가리킬 기울기
function drawGauges(t, cx, cy, pointer){
  ctx.save();
  ctx.translate(cx, cy);
  const arcR = Math.min(W,H)*0.36;
  ctx.strokeStyle = 'rgba(232,238,246,.5)'; ctx.lineWidth = 2;
  for (const d of [-45,-30,-20,-10,0,10,20,30,45]){
    const a = (d-90)*D2R, l = d % 30 ? 8 : 14;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*arcR, Math.sin(a)*arcR);
    ctx.lineTo(Math.cos(a)*(arcR-l), Math.sin(a)*(arcR-l)); ctx.stroke();
  }
  const pa = (pointer-90)*D2R;
  ctx.fillStyle = '#f2c14e';
  ctx.beginPath();
  ctx.moveTo(Math.cos(pa)*(arcR-16), Math.sin(pa)*(arcR-16));
  ctx.lineTo(Math.cos(pa-0.04)*(arcR-30), Math.sin(pa-0.04)*(arcR-30));
  ctx.lineTo(Math.cos(pa+0.04)*(arcR-30), Math.sin(pa+0.04)*(arcR-30));
  ctx.fill();
  if (opt.breath){
    const c = (t/1000) % 10;
    const k = c < 4 ? c/4 : 1 - (c-4)/6;
    const e = reduceMotion ? 0.5 : 0.5 - 0.5*Math.cos(Math.PI*k);
    ctx.strokeStyle = 'rgba(232,238,246,.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0, 40 + e*60, 0, Math.PI*2); ctx.stroke();
    $('breathText').textContent = L(c < 4 ? 'breath_in' : 'breath_out');
  }
  ctx.restore();
}

// ---------- QR 코드 (오프라인에서도 만들 수 있게 직접 생성: 바이트 모드, 오류 정정 M, 버전 1~10) ----------
function makeQR(text, forceMask){
  const ECC = [0,10,16,26,18,24,16,18,22,22,26], BLOCKS = [0,1,1,1,2,2,4,4,4,5,5];
  const bytes = Array.from(new TextEncoder().encode(text));
  const rawModules = v => { let r = (16*v + 128)*v + 64; if (v >= 2){ const n = Math.floor(v/7) + 2; r -= (25*n - 10)*n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCap = v => Math.floor(rawModules(v)/8) - ECC[v]*BLOCKS[v];
  let ver = 1;
  while (ver <= 10 && 4 + (ver < 10 ? 8 : 16) + bytes.length*8 > dataCap(ver)*8) ver++;
  if (ver > 10) throw new Error('QR text too long');
  const size = ver*4 + 17;

  // 데이터 비트: 모드(0100) + 길이 + 내용 + 종료 + 채움
  const bits = [];
  const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  put(4, 4); put(bytes.length, ver < 10 ? 8 : 16); for (const b of bytes) put(b, 8);
  const cap = dataCap(ver)*8;
  put(0, Math.min(4, cap - bits.length)); put(0, (8 - bits.length % 8) % 8);
  for (let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) put(pad, 8);
  const data = []; for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i+8).join(''), 2));

  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--){ z = (z << 1) ^ ((z >>> 7)*0x11D); z ^= ((y >>> i) & 1)*x; } return z & 0xFF; };
  const eccLen = ECC[ver], nb = BLOCKS[ver];
  const div = new Array(eccLen).fill(0); div[eccLen-1] = 1;
  for (let i = 0, root = 1; i < eccLen; i++){ for (let j = 0; j < eccLen; j++){ div[j] = mul(div[j], root); if (j + 1 < eccLen) div[j] ^= div[j+1]; } root = mul(root, 2); }
  const rem = d => { const r = new Array(eccLen).fill(0); for (const b of d){ const f = b ^ r.shift(); r.push(0); for (let i = 0; i < eccLen; i++) r[i] ^= mul(div[i], f); } return r; };
  const raw = Math.floor(rawModules(ver)/8), nShort = nb - raw % nb, shortLen = Math.floor(raw/nb);
  const blocks = [];
  for (let i = 0, k = 0; i < nb; i++){
    const dat = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1)); k += dat.length;
    const ecc = rem(dat); if (i < nShort) dat.push(0);
    blocks.push(dat.concat(ecc));
  }
  const code = [];
  for (let i = 0; i < blocks[0].length; i++) for (let j = 0; j < nb; j++) if (i !== shortLen - eccLen || j >= nShort) code.push(blocks[j][i]);

  // 기능 패턴
  const M = [], F = [];
  for (let y = 0; y < size; y++){ M.push(new Array(size).fill(false)); F.push(new Array(size).fill(false)); }
  const setF = (x, y, d) => { M[y][x] = d; F[y][x] = true; };
  for (let i = 0; i < size; i++){ setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
  for (const [cx, cy] of [[3,3],[size-4,3],[3,size-4]])
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++){
      const x = cx + dx, y = cy + dy, d = Math.max(Math.abs(dx), Math.abs(dy));
      if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, d !== 2 && d !== 4);
    }
  const align = [];
  if (ver > 1){
    const n = Math.floor(ver/7) + 2, step = Math.ceil((ver*4 + 4)/(n*2 - 2))*2;
    align.push(6); for (let pos = size - 7; align.length < n; pos -= step) align.splice(1, 0, pos);
  }
  for (let i = 0; i < align.length; i++) for (let j = 0; j < align.length; j++){
    if ((i === 0 && j === 0) || (i === 0 && j === align.length-1) || (i === align.length-1 && j === 0)) continue;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setF(align[i]+dx, align[j]+dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
  }
  const drawFormat = mask => {
    const d = (0 << 3) | mask;                // 오류 정정 M = 00
    let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9)*0x537);
    const b = ((d << 10) | r) ^ 0x5412, bit = i => ((b >>> i) & 1) !== 0;
    for (let i = 0; i <= 5; i++) setF(8, i, bit(i));
    setF(8, 7, bit(6)); setF(8, 8, bit(7)); setF(7, 8, bit(8));
    for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(i));
    for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(i));
    setF(8, size - 8, true);
  };
  drawFormat(0);
  if (ver >= 7){
    let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11)*0x1F25);
    const b = (ver << 12) | r;
    for (let i = 0; i < 18; i++){ const d = ((b >>> i) & 1) !== 0, a = size - 11 + i % 3, c = Math.floor(i/3); setF(a, c, d); setF(c, a, d); }
  }
  // 데이터 배치 (지그재그)
  let k = 0;
  for (let right = size - 1; right >= 1; right -= 2){
    if (right === 6) right = 5;
    for (let v = 0; v < size; v++) for (let j = 0; j < 2; j++){
      const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - v : v;
      if (!F[y][x] && k < code.length*8){ M[y][x] = ((code[k >>> 3] >>> (7 - (k & 7))) & 1) !== 0; k++; }
    }
  }
  // 마스크: 8가지 중 벌점이 가장 낮은 것
  const maskFn = [(x,y)=>(x+y)%2===0, (x,y)=>y%2===0, (x,y)=>x%3===0, (x,y)=>(x+y)%3===0,
    (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0, (x,y)=>x*y%2+x*y%3===0, (x,y)=>(x*y%2+x*y%3)%2===0, (x,y)=>((x+y)%2+x*y%3)%2===0];
  const applyMask = m => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && maskFn[m](x, y)) M[y][x] = !M[y][x]; };
  const penalty = () => {
    let p = 0, dark = 0;
    for (let a = 0; a < 2; a++) for (let i = 0; i < size; i++){
      let run = 1;
      for (let j = 1; j <= size; j++){
        const cur = j < size && (a ? M[j][i] : M[i][j]), prev = a ? M[j-1][i] : M[i][j-1];
        if (j < size && cur === prev) run++; else { if (run >= 5) p += run - 2; run = 1; }
      }
    }
    for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++){ const c = M[y][x]; if (c === M[y][x+1] && c === M[y+1][x] && c === M[y+1][x+1]) p += 3; }
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (M[y][x]) dark++;
    return p + Math.floor(Math.abs(dark*20 - size*size*10) / (size*size)) * 10;
  };
  let best = forceMask, bestP = Infinity;
  if (best === undefined) for (let m = 0; m < 8; m++){ applyMask(m); drawFormat(m); const s = penalty(); if (s < bestP){ bestP = s; best = m; } applyMask(m); }
  applyMask(best); drawFormat(best);
  return {size, version: ver, mask: best, dark: (x, y) => M[y][x]};
}

// ---------- 여행 사진 카드 (4:5 세로, 인스타그램 비율) ----------
function makeCard(){

    opt.phase = saved.phase; S.roll = saved.roll; S.zeroRoll = saved.zr; S.heading = saved.heading;
  }
  const g = card.getContext('2d'); g.setTransform(CD,0,0,CD,0,0);
  const font = getComputedStyle(document.body).fontFamily;
  // 위: 노선
  let gr = g.createLinearGradient(0, 0, 0, 250);
  gr.addColorStop(0, 'rgba(5,9,16,.82)'); gr.addColorStop(1, 'rgba(5,9,16,0)');
  g.fillStyle = gr; g.fillRect(0, 0, CW, 250);
  g.textBaseline = 'alphabetic';
  g.fillStyle = '#f2c14e'; g.font = `700 16px ${font}`; g.textAlign = 'center';
  g.fillText(L(faceImgs.filter(Boolean).length > 1 ? 'card_tag2' : 'card_tag1'), CW/2, 52);
  g.fillStyle = '#ffffff'; g.font = `800 58px ${font}`;
  g.textAlign = 'left'; g.fillText(opt.dep, 36, 118);
  g.textAlign = 'right'; g.fillText(opt.arr, CW - 36, 118);
  // 가운데 점선과 비행기
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2; g.setLineDash([5, 7]);
  g.beginPath(); g.moveTo(182, 99); g.lineTo(CW - 182, 99); g.stroke(); g.setLineDash([]);
  g.save(); g.translate(CW/2, 99); g.fillStyle = '#f2c14e';
  g.beginPath(); g.moveTo(16, 0); g.lineTo(-10, -4); g.lineTo(-14, -16); g.lineTo(-19, -16); g.lineTo(-16, -3); g.lineTo(-16, 3);
  g.lineTo(-19, 16); g.lineTo(-14, 16); g.lineTo(-10, 4); g.closePath(); g.fill();
  g.beginPath(); g.ellipse(0, 0, 17, 3.4, 0, 0, Math.PI*2); g.fill(); g.restore();
  g.fillStyle = '#d5deea'; g.font = `600 17px ${font}`;
  g.textAlign = 'left'; g.fillText(cityName(opt.dep), 38, 148);
  g.textAlign = 'right'; g.fillText(cityName(opt.arr), CW - 38, 148);
  const locale = {ko:'ko-KR', ja:'ja-JP', en:'en-US', zh:'zh-CN'}[opt.lang];
  g.fillStyle = 'rgba(213,222,234,.8)'; g.font = `500 14px ${font}`; g.textAlign = 'center';
  g.fillText(new Date().toLocaleDateString(locale, {year:'numeric', month:'long', day:'numeric'}), CW/2, 182);
  // 아래 오른쪽: 앱 아이콘 + QR 코드를 같은 크기로 나란히 (QR은 APP_URL로 연결)
  gr = g.createLinearGradient(0, CHh - 160, 0, CHh);
  gr.addColorStop(0, 'rgba(5,9,16,0)'); gr.addColorStop(1, 'rgba(5,9,16,.7)');
  g.fillStyle = gr; g.fillRect(0, CHh - 160, CW, 160);
  const q = makeQR(APP_URL), quiet = 3;
  const m = Math.max(2, Math.floor(108 / (q.size + quiet*2) * 2) / 2), tile = m*(q.size + quiet*2);
  const qx = CW - 24 - tile, qy = CHh - 24 - tile;
  const rad = tile*0.18;
  g.save(); g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 10;
  g.fillStyle = '#ffffff'; g.beginPath(); g.roundRect(qx, qy, tile, tile, rad); g.fill(); g.restore();
  g.fillStyle = '#0b1220';
  for (let y = 0; y < q.size; y++) for (let x = 0; x < q.size; x++) if (q.dark(x, y)) g.fillRect(qx + (x + quiet)*m, qy + (y + quiet)*m, m, m);
  if (appIcon.complete && appIcon.naturalWidth){
    const is = tile, ix = qx - 12 - is, iy = qy;
    g.save(); g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 10;
    g.beginPath(); g.roundRect(ix, iy, is, is, rad); g.fillStyle = '#6FB6F2'; g.fill(); g.restore();
    g.save(); g.beginPath(); g.roundRect(ix, iy, is, is, rad); g.clip(); g.drawImage(appIcon, ix, iy, is, is); g.restore();
  }
  return card;
}
let cardFile = null, cardURL = null;
async function openCard(){
  const card = makeCard();
  if (!running) draw(0);
  const blob = await new Promise(r => card.toBlob(r, 'image/jpeg', 0.92));
  if (!blob) return;
  if (cardURL) URL.revokeObjectURL(cardURL);
  cardURL = URL.createObjectURL(blob);
  cardFile = new File([blob], `horizon-${opt.dep}-${opt.arr}.jpg`, {type:'image/jpeg'});
  $('shareImg').src = cardURL; $('shareImg').alt = `${cityName(opt.dep)} → ${cityName(opt.arr)}`;
  $('shareSheet').hidden = false;
}
const saveCard = () => { const a = document.createElement('a'); a.href = cardURL; a.download = cardFile.name; document.body.appendChild(a); a.click(); a.remove(); };
$('btnCard').addEventListener('click', openCard);
$('btnCard2').addEventListener('click', openCard);
$('shareSave').addEventListener('click', saveCard);
$('shareGo').addEventListener('click', async () => {
  const text = `${cityName(opt.dep)} → ${cityName(opt.arr)} ✈ ${L('app')} ${APP_URL}`;
  if (navigator.canShare && navigator.canShare({files:[cardFile]})){
    try{ await navigator.share({files:[cardFile], text}); }catch(e){}
  } else saveCard();
});
$('shareClose').addEventListener('click', () => $('shareSheet').hidden = true);
for (const id of ['shareSheet']) $(id).addEventListener('click', e => { if (e.target.id === id) $(id).hidden = true; });

// 시작 화면 뒤에 출발 도시 그려두기
draw(0);

// 오프라인(비행기 모드) 지원
if ('serviceWorker' in navigator && window.isSecureContext){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
</script>
